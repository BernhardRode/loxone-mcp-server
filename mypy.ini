[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True

[mypy-loxone_mcp.device_manager]
ignore_errors = True

[mypy-loxone_mcp.loxone_client]
ignore_errors = True

[mypy-loxone_mcp.client_session]
ignore_errors = True

[mypy-loxone_mcp.server]
ignore_errors = True

[mypy-loxone_mcp.config]
ignore_errors = True

[mypy-loxone_mcp.connection_manager]
ignore_errors = True

[mypy-loxone_mcp.simple_server]
ignore_errors = True

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: python
          token: ${{ secrets.GITHUB_TOKEN }}
          # ✅ Create draft releases first so we can upload assets
          draft: true

      # UV build steps - only run when a new release is created
      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UV
        if: ${{ steps.release.outputs.release_created }}
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: uv sync --frozen

      - name: Build package with UV
        if: ${{ steps.release.outputs.release_created }}
        run: uv build --wheel --sdist

      - name: Validate build artifacts
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "✅ Checking build outputs..."
          ls -la dist/
          python -m pip install dist/*.whl --dry-run --quiet
          tar -tzf dist/*.tar.gz | head -10

      - name: Store build artifacts
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

      # Optional smoke tests to ensure distributions work correctly
      - name: Smoke test (wheel)
        if: ${{ steps.release.outputs.release_created }}
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

      - name: Smoke test (source distribution)
        if: ${{ steps.release.outputs.release_created }}
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.python

      # ✅ Publish to PyPI after successful release
      - name: Publish to PyPI
        if: ${{ steps.release.outputs.release_created }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

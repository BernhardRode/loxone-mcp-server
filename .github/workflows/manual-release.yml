name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Type of release to create'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-permissions:
    runs-on: ubuntu-latest
    outputs:
      can_release: ${{ steps.check.outputs.can_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check repository permissions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if the user has write permissions to the repository
          echo "Checking permissions for user: ${{ github.actor }}"
          
          # Block automated accounts from triggering manual releases
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]] || [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
            echo "can_release=false" >> $GITHUB_OUTPUT
            echo "❌ Automated accounts cannot trigger manual releases"
            exit 1
          fi
          
          # Check if user has write access to the repository
          # This uses the GitHub CLI to check repository permissions
          user_permission=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission' 2>/dev/null || echo "none")
          
          case "$user_permission" in
            admin|write)
              echo "✅ User has sufficient permissions: $user_permission"
              echo "can_release=true" >> $GITHUB_OUTPUT
              ;;
            read|none)
              echo "❌ User has insufficient permissions: $user_permission"
              echo "Manual releases require write or admin permissions"
              echo "can_release=false" >> $GITHUB_OUTPUT
              exit 1
              ;;
            *)
              echo "⚠️ Unknown permission level: $user_permission"
              echo "Proceeding with caution - GitHub will enforce permissions at API level"
              echo "can_release=true" >> $GITHUB_OUTPUT
              ;;
          esac

  check-existing-release:
    runs-on: ubuntu-latest
    needs: validate-permissions
    if: needs.validate-permissions.outputs.can_release == 'true'
    outputs:
      has_open_pr: ${{ steps.check-pr.outputs.has_open_pr }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for existing release PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing release PRs..."
          
          # Check for release-please PRs (multiple possible patterns)
          release_pr_patterns=(
            "chore(main): release"
            "chore: release"
            "release:"
          )
          
          total_open_prs=0
          
          for pattern in "${release_pr_patterns[@]}"; do
            echo "Checking for PRs matching pattern: $pattern"
            open_prs=$(gh pr list --state open --author "github-actions[bot]" --search "$pattern" --json number,title,url 2>/dev/null || echo "[]")
            pr_count=$(echo "$open_prs" | jq length)
            
            if [[ $pr_count -gt 0 ]]; then
              echo "Found $pr_count open release PR(s) matching '$pattern':"
              echo "$open_prs" | jq -r '.[] | "  - #\(.number): \(.title) (\(.url))"'
              total_open_prs=$((total_open_prs + pr_count))
            fi
          done
          
          # Also check for any PRs with "release" in the title from release-please bot
          echo "Checking for any release-related PRs from github-actions[bot]..."
          other_release_prs=$(gh pr list --state open --author "github-actions[bot]" --json number,title,url | jq '[.[] | select(.title | test("release"; "i"))]')
          other_pr_count=$(echo "$other_release_prs" | jq length)
          
          if [[ $other_pr_count -gt 0 ]]; then
            echo "Found $other_pr_count additional release-related PR(s):"
            echo "$other_release_prs" | jq -r '.[] | "  - #\(.number): \(.title) (\(.url))"'
            total_open_prs=$((total_open_prs + other_pr_count))
          fi
          
          if [[ $total_open_prs -gt 0 ]]; then
            echo "has_open_pr=true" >> $GITHUB_OUTPUT
            echo ""
            echo "❌ Manual release blocked: Found $total_open_prs existing release PR(s)"
            echo "Please merge or close the existing release PR(s) before triggering a manual release"
            echo "This prevents conflicts between automated and manual release processes"
            exit 1
          else
            echo "has_open_pr=false" >> $GITHUB_OUTPUT
            echo "✅ No existing release PRs found. Manual release can proceed."
          fi

  manual-release:
    runs-on: ubuntu-latest
    needs: [validate-permissions, check-existing-release]
    if: needs.validate-permissions.outputs.can_release == 'true' && needs.check-existing-release.outputs.has_open_pr == 'false'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Validate release type input
        run: |
          echo "Validating release type input: '${{ github.event.inputs.release-type }}'"
          
          # Validate that release-type is one of the allowed values
          case "${{ github.event.inputs.release-type }}" in
            patch)
              echo "✅ Valid release type: patch (will increment patch version)"
              ;;
            minor)
              echo "✅ Valid release type: minor (will increment minor version and reset patch to 0)"
              ;;
            major)
              echo "✅ Valid release type: major (will increment major version and reset minor/patch to 0)"
              ;;
            "")
              echo "❌ Release type is empty or not provided"
              echo "Must specify one of: patch, minor, major"
              exit 1
              ;;
            *)
              echo "❌ Invalid release type: '${{ github.event.inputs.release-type }}'"
              echo "Must be one of: patch, minor, major"
              echo "Received: '${{ github.event.inputs.release-type }}'"
              exit 1
              ;;
          esac
          
          echo "Release type validation passed"

      - name: Validate repository state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Validating repository state for manual release..."
          
          # Check if we're on the main branch
          current_branch=$(git branch --show-current)
          if [[ "$current_branch" != "main" ]]; then
            echo "❌ Manual releases can only be triggered from the main branch"
            echo "Current branch: $current_branch"
            exit 1
          fi
          
          # Check if there are any uncommitted changes
          if ! git diff --quiet; then
            echo "❌ Repository has uncommitted changes"
            echo "Please commit or stash changes before triggering a manual release"
            git status --porcelain
            exit 1
          fi
          
          # Check if the working directory is clean
          if ! git diff --cached --quiet; then
            echo "❌ Repository has staged but uncommitted changes"
            echo "Please commit staged changes before triggering a manual release"
            git status --porcelain
            exit 1
          fi
          
          echo "✅ Repository state validation passed"

      - name: Run manual release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: python
          token: ${{ secrets.GITHUB_TOKEN }}
          command: github-release
          # Force the release type specified by user input
          version-type: ${{ github.event.inputs.release-type }}

      # UV build steps - only run when release is created
      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install UV
        if: ${{ steps.release.outputs.release_created }}
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: uv sync --frozen

      - name: Build package with UV
        if: ${{ steps.release.outputs.release_created }}
        run: uv build --wheel --sdist

      - name: Validate build artifacts
        if: ${{ steps.release.outputs.release_created }}
        run: |
          # Check that both wheel and source distribution were created
          ls -la dist/
          # Verify wheel can be installed
          python -m pip install dist/*.whl --dry-run --quiet
          # Check that source distribution contains expected files
          tar -tzf dist/*.tar.gz | head -10

      - name: Store build artifacts
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-manual
          path: dist/
          retention-days: 7

      - name: Upload release assets
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload wheel and source distribution to the GitHub release
          gh release upload ${{ steps.release.outputs.tag_name }} dist/*.whl dist/*.tar.gz --clobber

      # Optional: Publish to PyPI (if PyPI token is configured)
      - name: Publish to PyPI
        if: ${{ steps.release.outputs.release_created && secrets.PYPI_API_TOKEN }}
        run: |
          uv publish --token ${{ secrets.PYPI_API_TOKEN }}

  notify-result:
    runs-on: ubuntu-latest
    needs: [validate-permissions, check-existing-release, manual-release]
    if: always()
    steps:
      - name: Report manual release result
        run: |
          if [[ "${{ needs.validate-permissions.result }}" == "failure" ]]; then
            echo "❌ Manual release failed: Insufficient permissions"
            exit 1
          elif [[ "${{ needs.check-existing-release.result }}" == "failure" ]]; then
            echo "❌ Manual release blocked: Existing release PR found"
            exit 1
          elif [[ "${{ needs.manual-release.outputs.release_created }}" == "true" ]]; then
            echo "✅ Manual release successful!"
            echo "Release: ${{ needs.manual-release.outputs.tag_name }}"
            echo "Version: ${{ needs.manual-release.outputs.version }}"
          else
            echo "ℹ️ Manual release completed but no release was created"
            echo "This may happen if there are no releasable changes since the last release"
          fi